[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boarding-lab"
version = "0.3.0"
description = "Deterministic passenger boarding and frustration research simulator"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Dennis Kefalas"}]
readme = "README.md"
dependencies = []

[project.scripts]
boarding-lab = "boarding_sim.__main__:main"

[tool.unittest]
start-directory = "tests"
